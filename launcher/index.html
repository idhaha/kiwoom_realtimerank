<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIWOOM TRADE LAUNCHER</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="glass-container">
        <header class="title-bar">
            <div class="title">KIWOOM TRADE LAUNCHER</div>
            <div class="window-controls">
                <button id="min-btn" title="최소화">-</button>
                <button id="max-btn" title="최대화">&#9723;</button>
                <button id="close-btn" title="닫기">&times;</button>
            </div>
        </header>

        <main class="content">
            <div class="input-group">
                <div class="field">
                    <label>서버 포트</label>
                    <input type="number" id="port-input" value="3001">
                </div>
                <div class="field">
                    <label>ngrok 고정 도메인</label>
                    <input type="text" id="ngrok-input" placeholder="example.ngrok-free.app">
                </div>
                <div class="field" style="justify-content: flex-end; padding-bottom: 5px;">
                    <label class="checkbox-field">
                        <input type="checkbox" id="log-file-check"> 로그 파일 저장 <span
                            class="log-path-hint">(launcher_debug.log)</span>
                    </label>
                </div>
            </div>

            <div class="button-group">
                <button id="server-btn" class="btn primary">1. 서버 시작</button>
                <button id="ngrok-btn" class="btn secondary">2. 터널 연결</button>
            </div>

            <div class="console-wrapper">
                <div id="console-output" class="console"></div>
            </div>
        </main>

        <footer class="status-bar">
            <span id="server-status" class="status-dot"></span> 서버 중지됨
            <span id="ngrok-status" class="status-dot"></span> 터널 연결 안됨
        </footer>
    </div>

    <script src="renderer.js"></script>
</body>

</html>
