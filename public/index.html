<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="키움증권 실시간 종목 조회 순위 - 실시간으로 업데이트되는 주식 데이터">
    <title>Rank</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="tabContainer" class="tab-container">
        <!-- Permanent and Dynamic Tab Buttons go here -->
        <button id="addTabBtn" class="add-tab-btn" title="탭 추가">+</button>

        <div class="right-controls">
            <button id="captureBtn" class="capture-btn" title="화면 캡처">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                    <circle cx="12" cy="13" r="4"></circle>
                </svg>
            </button>
        </div>
    </div>

    <div id="tabContents" class="tab-contents">
        <!-- Rank Tab (Permanent) -->
        <div id="tab_rank" class="tab-content active">
            <div class="container">
                <header>
                    <div class="header-single-line">
                        <h1><strong>Rank</strong></h1>
                        <div class="header-controls">
                            <div class="refresh-control">
                                <select id="refreshInterval" class="interval-select">
                                    <option value="5" data-interval="30000">30초 간격</option>
                                    <option value="1" data-interval="60000">1분 간격</option>
                                    <option value="2" data-interval="600000" selected>10분 간격</option>
                                    <option value="3" data-interval="3600000">1시간 간격</option>
                                    <option value="4" data-interval="30000">당일누적</option>
                                </select>
                            </div>
                            <button id="manualRefresh" class="btn-refresh" aria-label="조회">
                                조회
                            </button>
                        </div>
                    </div>
                    <div class="status-info">
                        <span id="lastUpdate">-</span>
                        <span class="status-separator">|</span>
                        <span id="statusText">대기 중...</span>
                    </div>
                </header>

                <div id="errorMessage" class="error-message" style="display: none;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    <div>
                        <h3>데이터 로딩 실패</h3>
                        <p id="errorText"></p>
                    </div>
                </div>

                <div class="grid-container">
                    <div class="panel">
                        <div class="panel-header">
                            <h2>Transaction Money Rank</h2>
                            <div class="panel-controls">
                                <select id="mrktTp" class="interval-select">
                                    <option value="000" selected>전체</option>
                                    <option value="001">코스피</option>
                                    <option value="101">코스닥</option>
                                </select>
                                <select id="stexTp" class="interval-select">
                                    <option value="1">KRX</option>
                                    <option value="2">NXT</option>
                                    <option value="3" selected>통합</option>
                                </select>
                            </div>
                        </div>
                        <div class="table-wrapper">
                            <table id="transactionTable">
                                <thead>
                                    <tr>
                                        <th>순위</th>
                                        <th>시장</th>
                                        <th>종목명</th>
                                        <th>등락률</th>
                                        <th class="align-right">거래대금(백만)</th>
                                    </tr>
                                </thead>
                                <tbody id="transactionBody">
                                    <!-- Data injected here -->
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div class="panel">
                        <div class="panel-header">
                            <h2>Realtime Query Rank</h2>
                        </div>
                        <div id="dataContainer" style="display: none;">
                            <div class="table-wrapper">
                                <table id="stockTable">
                                    <thead>
                                        <tr>
                                            <th>순위</th>
                                            <th>시장</th>
                                            <th>종목명</th>
                                            <th>등락률</th>
                                            <th class="align-right">거래대금(백만)</th>
                                        </tr>
                                    </thead>
                                    <tbody id="tableBody">
                                        <!-- 데이터가 동적으로 삽입됩니다 -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- Other tabs injected here -->
    </div>

    <!-- Context Menu for Tabs -->
    <div id="contextMenu" class="context-menu" style="display: none;">
        <ul>
            <li id="deleteTab">탭 삭제</li>
        </ul>
    </div>
    <script src="app.js"></script>
</body>

</html>
