<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="키움증권 실시간 종목 조회 순위 - 실시간으로 업데이트되는 주식 데이터">
    <title>키움증권 실시간종목조회순위</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>
                <span class="gradient-text">키움증권</span>
                <span class="subtitle">실시간종목조회순위</span>
            </h1>
            <div class="header-controls">
                <div class="refresh-control">
                    <label class="toggle-switch">
                        <input type="checkbox" id="autoRefresh" checked>
                        <span class="slider"></span>
                    </label>
                    <span class="toggle-label">자동 새로고침 (30초)</span>
                </div>
                <button id="manualRefresh" class="btn-refresh" aria-label="수동 새로고침">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
                    </svg>
                    새로고침
                </button>
            </div>
        </header>

        <div id="statusBadge" class="status-badge">
            <span class="status-dot"></span>
            <span id="statusText">대기 중...</span>
        </div>

        <div id="loadingIndicator" class="loading-container">
            <div class="loading-spinner"></div>
            <p>데이터를 불러오는 중...</p>
        </div>

        <div id="errorMessage" class="error-message" style="display: none;">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <div>
                <h3>데이터 로딩 실패</h3>
                <p id="errorText"></p>
            </div>
        </div>

        <div id="dataContainer" style="display: none;">
            <div class="table-wrapper">
                <table id="stockTable">
                    <thead>
                        <tr>
                            <th>순위</th>
                            <th>종목코드</th>
                            <th>종목명</th>
                            <th>현재가</th>
                            <th>등락률</th>
                            <th>거래량</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- 데이터가 동적으로 삽입됩니다 -->
                    </tbody>
                </table>
            </div>
        </div>

        <footer>
            <p>마지막 업데이트: <span id="lastUpdate">-</span></p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
